name: Build & Release APK

on:
  push:
    tags:
      - 'v*'        # Trigger on version tags like v1.0.0
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab
  pull_request:
    branches: [main]

permissions:
  contents: write  # Needed to create releases

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_apk_path: ${{ steps.build_release.outputs.apk_path }}
      debug_apk_path: ${{ steps.build_debug.outputs.apk_path }}

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup JDK 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r26c
          build-tools-version: 34.0.0

      # 4. Cache Gradle dependencies
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 5. Make gradlew executable
      - name: Make gradlew executable
        run: chmod +x gradlew

      # 6. Extract version from tag or use default
      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="dev-$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      # 7. Build Debug APK
      - name: Build Debug APK
        id: build_debug
        run: |
          ./gradlew assembleDebug
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Debug APK: $APK_PATH"

      # 8. Build Release APK (unsigned - for testing)
      - name: Build Release APK (unsigned)
        id: build_release
        run: |
          ./gradlew assembleRelease
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Release APK (unsigned): $APK_PATH"

      # 9. Upload Debug APK as artifact
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ steps.version.outputs.version }}
          path: ${{ steps.build_debug.outputs.apk_path }}
          retention-days: 30

      # 10. Upload Release APK as artifact
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned-${{ steps.version.outputs.version }}
          path: ${{ steps.build_release.outputs.apk_path }}
          retention-days: 30

  # ============================================================
  # SIGN & RELEASE JOB (only runs on version tags)
  # ============================================================
  sign-and-release:
    name: Sign & Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: app-release-unsigned-${{ needs.build.outputs.version }}
          path: ./apk

      # Sign the APK (requires keystore in GitHub Secrets)
      - name: Sign APK
        id: sign_apk
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: ./apk
          signingKeyBase64: ${{ secrets.SIGNING_KEY_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      # Create GitHub Release with signed APK
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## HelloWorld v${{ needs.build.outputs.version }}

            ### Changes
            - Built from commit: ${{ github.sha }}

            ### Downloads
            - **Signed Release APK**: `app-release-signed.apk`
            - **Debug APK**: Available in workflow artifacts

            ### Installation
            1. Download `app-release-signed.apk`
            2. Enable "Install from unknown sources" on your Android device
            3. Open the APK to install
          files: |
            ./apk/app-release-signed.apk
          draft: false
          prerelease: false

  # ============================================================
  # NOTIFICATION JOB (optional - notify on completion)
  # ============================================================
  notify:
    name: Notify
    needs: [build, sign-and-release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Build Status
        run: |
          echo "Build completed!"
          echo "Debug APK: Available in artifacts"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "Release: Created at https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
          fi